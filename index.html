  .abs { position:absolute; transform:translate(-50%,-50%); }

  /* black strip hides the baked-in dots so live ones can fill and shake */
  #dots { left:calc(var(--x) * 369); top:calc(var(--y) * 385); width:calc(var(--x) * 420); height:calc(var(--y) * 50);
    background:#000; display:flex; justify-content:center; align-items:center; gap:calc(var(--x) * 46); }
  .dot { width:calc(var(--x) * 24); height:calc(var(--x) * 24); border:calc(var(--x) * 2.2) solid #fff; border-radius:50%; }
  .dot.filled { background:#fff; }
  #dots.shake { animation:shake .5s; }
  @keyframes shake {
    10%,90%{transform:translate(calc(-50% - 2px),-50%)} 20%,80%{transform:translate(calc(-50% + 4px),-50%)}
    30%,50%,70%{transform:translate(calc(-50% - 8px),-50%)} 40%,60%{transform:translate(calc(-50% + 8px),-50%)}
  }

  /* invisible tap zones over the screenshot's keys; flash on press like iOS */
  .key { width:calc(var(--x) * 144); height:calc(var(--x) * 144); border-radius:50%; background:rgba(255,255,255,0); transition:background .25s; }
  .key.down { background:rgba(255,255,255,.35); transition:none; }
  #cancel { left:calc(var(--x) * 561); top:calc(var(--y) * 1487); width:calc(var(--x) * 160); height:calc(var(--y) * 80); }
</style>
</head>
<body>
  <div id="lock">
    <div id="dots" class="abs">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
    <div id="cancel" class="abs"></div>
  </div>

<script>
  const FAILS_BEFORE_OPEN = 3;   // opens on the 4th attempt
  const CODE_LENGTH = 6;
  // key centers in screenshot pixels
  const KEYS = { 1:[176,630], 2:[369,630], 3:[561,630], 4:[176,810], 5:[369,810], 6:[561,810],
                 7:[176,992], 8:[369,992], 9:[561,992], 0:[369,1168] };

  let entered = "", attempts = 0;
  const lock = document.getElementById('lock');
  const dotRow = document.getElementById('dots');
  const dots = [...document.querySelectorAll('.dot')];

  const render = () => dots.forEach((d, i) => d.classList.toggle('filled', i < entered.length));

  for (const [n, [x, y]] of Object.entries(KEYS)) {
    const k = document.createElement('div');
    k.className = 'abs key';
    k.style.left = `calc(var(--x) * ${x})`;
    k.style.top = `calc(var(--y) * ${y})`;
    k.addEventListener('pointerdown', () => {
      k.classList.add('down');
      if (entered.length >= CODE_LENGTH) return;
      entered += n;
      render();
      if (entered.length === CODE_LENGTH) setTimeout(submit, 120);
    });
    k.addEventListener('pointerup', () => k.classList.remove('down'));
    k.addEventListener('pointerleave', () => k.classList.remove('down'));
    lock.appendChild(k);
  }

  // ponytail: label stays "Cancel" (baked into the screenshot); tapping it still deletes a digit
  document.getElementById('cancel').addEventListener('pointerdown', () => { entered = entered.slice(0, -1); render(); });

  function submit() {
    attempts++;
    if (attempts > FAILS_BEFORE_OPEN) {
      lock.style.opacity = 0; // fades to black; swipe up to land on the real Home Screen
      return;
    }
    dotRow.classList.add('shake');
    setTimeout(() => { dotRow.classList.remove('shake'); entered = ""; render(); }, 500);
  }
</script>
</body>
