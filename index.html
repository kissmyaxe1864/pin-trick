  #dots { left:calc(var(--x) * 369); top:calc(var(--y) * 385); display:flex; gap:calc(var(--x) * 46); }

    10%,90%{transform:translate(calc(-50% - 2px),-50%)} 20%,80%{transform:translate(calc(-50% + 4px),-50%)}

  .key { width:calc(var(--x) * 144); height:calc(var(--x) * 144); border-radius:50%; background:rgba(255,255,255,0); transition:background .25s; }

<body>
  <div id="home" class="layer"></div>
  <div id="pass" class="layer anim">
    <div id="dots" class="abs">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
  </div>
  <div id="lock" class="layer anim"></div>

<script>
  const FAILS_BEFORE_OPEN = 3;   // opens on the 4th attempt
  const CODE_LENGTH = 6;
  // key centers in screenshot pixels
  const KEYS = { 1:[176,630], 2:[369,630], 3:[561,630], 4:[176,810], 5:[369,810], 6:[561,810],
                 7:[176,992], 8:[369,992], 9:[561,992], 0:[369,1168] };
  const CLOCK_FONT = '900 100px ui-serif, "New York", Georgia, serif';
  const TEXT_FONT = 'system-ui, -apple-system, "Helvetica Neue", sans-serif';

  const $ = id => document.getElementById(id);
  const home = $('home'), pass = $('pass'), lock = $('lock'), dotRow = $('dots');
  const dots = [...document.querySelectorAll('.dot')];
  let entered = "", attempts = 0;

  // A canvas over screenshot region (x0,y0)-(x1,y1); draw() gets a context in screenshot pixels.
  function region(parent, x0, y0, x1, y1, draw) {
    const c = document.createElement('canvas');
    Object.assign(c.style, { left:`calc(var(--x) * ${x0})`, top:`calc(var(--y) * ${y0})`,
      width:`calc(var(--x) * ${x1 - x0})`, height:`calc(var(--y) * ${y1 - y0})` });
    parent.appendChild(c);
    const ctx = c.getContext('2d');
    const redraw = () => {
      const r = c.getBoundingClientRect(), dpr = devicePixelRatio || 1;
      c.width = r.width * dpr; c.height = r.height * dpr;
      const kx = c.width / (x1 - x0), ky = c.height / (y1 - y0);
      ctx.setTransform(kx, 0, 0, ky, -x0 * kx, -y0 * ky);
      draw(ctx);
    };
    redraw();
    addEventListener('resize', redraw);
    return { el: c, redraw };
  }

  // ---- lock screen: live date + clock drawn where the screenshot's were ----
  const ink = (ctx, s) => { const m = ctx.measureText(s);
    return { l: m.actualBoundingBoxLeft, r: m.actualBoundingBoxRight, a: m.actualBoundingBoxAscent, d: m.actualBoundingBoxDescent }; };

  const lockText = region(lock, 0, 150, 739, 420, ctx => {
    const now = new Date();
    ctx.fillStyle = '#f2f2f2';
    ctx.font = `600 48px ${TEXT_FONT}`;
    ctx.textAlign = 'right';
    ctx.fillText(`${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][now.getDay()]} ${now.getDate()}`, 402, 211);

    // clock: stretch the font so "7:46" fills exactly the screenshot's 478x163 box
    ctx.textAlign = 'left';
    ctx.font = CLOCK_FONT;
    const ref = ink(ctx, '7:46');
    const sx = 478 / (ref.l + ref.r), sy = 163 / (ref.a + ref.d);
    const time = `${now.getHours() % 12 || 12}:${String(now.getMinutes()).padStart(2, '0')}`;
    const m = ink(ctx, time);
    ctx.save();
    ctx.translate(369 - (m.r - m.l) * sx / 2, 240 + m.a * sy);
    ctx.scale(sx, sy);
    const g = ctx.createLinearGradient(0, -m.a, 0, m.d);
    g.addColorStop(0, '#8a8a8a'); g.addColorStop(.5, '#5a5a5a'); g.addColorStop(1, '#6a6a6a');
    ctx.fillStyle = g;
    ctx.fillText(time, 0, 0);
    ctx.lineWidth = 2 / sy;
    ctx.strokeStyle = 'rgba(255,255,255,.28)';
    ctx.strokeText(time, 0, 0);
    ctx.restore();
  });
  setInterval(lockText.redraw, 1000);

  // ---- swipe up on the lock screen to reach the passcode screen ----
  let y0 = null;
  lock.addEventListener('pointerdown', e => { y0 = e.clientY; lock.classList.remove('anim'); pass.classList.remove('anim'); });
  lock.addEventListener('pointermove', e => {
    if (y0 === null) return;
    const dy = Math.min(0, e.clientY - y0), p = Math.min(1, -dy / innerHeight * 2.5);
    lock.style.transform = `translateY(${dy}px)`;
    lock.style.opacity = 1 - p;
    pass.style.opacity = p;
  });
  const endSwipe = e => {
    if (y0 === null) return;
    const dy = e.clientY - y0;
    y0 = null;
    lock.classList.add('anim'); pass.classList.add('anim');
    dy < -innerHeight * 0.12 ? showPass() : showLock();
  };
  lock.addEventListener('pointerup', endSwipe);
  lock.addEventListener('pointercancel', endSwipe);

  function showPass() {
    lock.style.transform = 'translateY(-100%)'; lock.style.opacity = 0; lock.style.pointerEvents = 'none';
    pass.style.opacity = 1; pass.style.pointerEvents = 'auto';
  }
  function showLock() {
    entered = ""; render();
    lock.style.transform = ''; lock.style.opacity = 1; lock.style.pointerEvents = '';
    pass.style.opacity = 0; pass.style.pointerEvents = 'none';
  }

  // ---- passcode screen ----
  const label = region(pass, 440, 1440, 680, 1530, ctx => {
    ctx.fillStyle = '#fff';
    ctx.font = `500 31.5px ${TEXT_FONT}`;
    ctx.textAlign = 'center';
    ctx.fillText(entered ? 'Delete' : 'Cancel', 561.5, 1497);
  });
  label.el.addEventListener('pointerdown', () => {
    if (!entered) return showLock();   // real iOS: Cancel goes back to the lock screen
    entered = entered.slice(0, -1); render();
  });

  function render() {
    dots.forEach((d, i) => d.classList.toggle('filled', i < entered.length));
    label.redraw();
  }

  for (const [n, [x, y]] of Object.entries(KEYS)) {
    const k = document.createElement('div');
    k.className = 'abs key';
    k.style.left = `calc(var(--x) * ${x})`;
    k.style.top = `calc(var(--y) * ${y})`;
    k.addEventListener('pointerdown', () => {
      k.classList.add('down');
      if (entered.length >= CODE_LENGTH) return;
      entered += n;
      render();
      if (entered.length === CODE_LENGTH) setTimeout(submit, 120);
    });
    for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) k.addEventListener(ev, () => k.classList.remove('down'));
    pass.appendChild(k);
  }

  function submit() {
    attempts++;
    if (attempts > FAILS_BEFORE_OPEN) return unlock();
    dotRow.classList.add('shake');
    setTimeout(() => { dotRow.classList.remove('shake'); entered = ""; render(); }, 500);
  }

  // iOS-style unlock: passcode fades, home screen zooms in. Swiping up from here
  // exits to the real Home Screen, which looks identical to src/home.png.
  function unlock() {
    pass.style.opacity = 0; pass.style.pointerEvents = 'none';
    home.classList.add('anim');
    home.style.opacity = 1; home.style.transform = 'scale(1)';
  }

  // Leaving the app (swipe home) resets it, so it opens on the lock screen next time.
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) return;
    attempts = 0;
    home.classList.remove('anim'); home.style.opacity = 0; home.style.transform = 'scale(1.12)';
    lock.classList.remove('anim'); pass.classList.remove('anim');
    showLock();
    requestAnimationFrame(() => { lock.classList.add('anim'); pass.classList.add('anim'); });
  });
</script>
</body>
</html>
